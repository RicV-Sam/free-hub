<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Nedbank Greenbacks Checkers Trolley Dash competition</title>
  <desc id="desc">Campaign-specific editorial card showing a R10,000 Checkers trolley dash prize and the 30 November 2026 closing date.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#063b2d"/>
      <stop offset="1" stop-color="#00a86b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1410" cy="120" r="280" fill="#ffe400" opacity=".94"/>
  <circle cx="1450" cy="850" r="390" fill="#ffffff" opacity=".08"/>
  <text x="110" y="135" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700">NEDBANK GREENBACKS × CHECKERS</text>
  <text x="110" y="275" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="800">WIN A R10,000</text>
  <text x="110" y="375" fill="#ffe400" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="800">TROLLEY DASH</text>
  <text x="115" y="455" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="38">40 winners • 10 winners each month</text>
  <g transform="translate(1030 280)" fill="none" stroke="#fff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
    <path d="M20 20h110l80 350h350l80-245H170"/>
    <path d="M245 210h330M300 115v250M420 115v250M540 115v250" opacity=".8"/>
    <circle cx="270" cy="440" r="42" fill="#ffe400" stroke="#ffe400"/>
    <circle cx="535" cy="440" r="42" fill="#ffe400" stroke="#ffe400"/>
  </g>
  <rect x="110" y="590" width="770" height="150" rx="28" fill="#fff" filter="url(#shadow)"/>
  <text x="155" y="650" fill="#063b2d" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">OPEN A QUALIFYING NEW MIGOALS ACCOUNT</text>
  <text x="155" y="704" fill="#063b2d" font-family="Arial, Helvetica, sans-serif" font-size="29">then meet the deposit or card-spend entry rules</text>
  <text x="110" y="825" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">ENDS 30 NOVEMBER 2026</text>
  <text x="1490" y="855" text-anchor="end" fill="#fff" opacity=".78" font-family="Arial, Helvetica, sans-serif" font-size="22">Freehub editorial competition card</text>
</svg>
