<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Nedbank YouthX Awards 2026</title>
  <desc id="desc">Campaign-specific editorial card for the YouthX Awards showing a R250,000 first prize and the 9 October 2026 closing date.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#051d18"/>
      <stop offset=".55" stop-color="#004b37"/>
      <stop offset="1" stop-color="#00b46f"/>
    </linearGradient>
    <linearGradient id="x" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f187"/>
      <stop offset="1" stop-color="#9d4edd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <path d="M1110 -100l160 0 155 250 155-250h160l-245 390 265 420h-165l-175-275-175 275h-165l265-420z" fill="url(#x)" opacity=".82"/>
  <text x="105" y="140" fill="#00f187" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="800">YOUTHX BY NEDBANK</text>
  <text x="105" y="300" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="118" font-weight="850">YOUTHX</text>
  <text x="105" y="415" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="118" font-weight="850">AWARDS 2026</text>
  <rect x="105" y="505" width="810" height="175" rx="30" fill="#fff" filter="url(#shadow)"/>
  <text x="160" y="578" fill="#004b37" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700">FIRST PRIZE</text>
  <text x="160" y="645" fill="#004b37" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="850">R250,000</text>
  <text x="105" y="760" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="34">For South African changemakers aged 18–26</text>
  <text x="105" y="825" fill="#00f187" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="750">ENTER BY 9 OCTOBER 2026</text>
  <text x="1490" y="855" text-anchor="end" fill="#fff" opacity=".78" font-family="Arial, Helvetica, sans-serif" font-size="22">Freehub editorial competition card</text>
</svg>
