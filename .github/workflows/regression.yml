name: Regression harness

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TZ: UTC
  FREEHUB_BUILD_DATE: "2026-09-08"
  FREEHUB_AS_OF_DATE: "2026-09-08"

jobs:
  promotions:
    name: Contextual house promotions
    runs-on: ubuntu-latest
    env:
      FREEHUB_BUILD_DATE: '2026-11-10'
      FREEHUB_AS_OF_DATE: '2026-11-10'
      FREEHUB_ENABLE_PROMOTIONS: 'true'
      FREEHUB_ENABLE_OFFERS: 'true'
      FREEHUB_ENABLE_OPPORTUNITIES: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - env:
          NODE_OPTIONS: '--require=${{ github.workspace }}/scripts/lib/fixed-date-register.js'
        run: npm run build
      - run: npm run test:promotions
      - env:
          NODE_OPTIONS: '' # Browser fixtures control page clocks; keep automation time real.
        run: npm run test:promotions:browser

  airtime-worker:
    name: Airtime Dash server verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloudflare/airtime-dash/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: cloudflare/airtime-dash
      - run: npm run build
        working-directory: cloudflare/airtime-dash
      - run: npm test
        working-directory: cloudflare/airtime-dash

  baseline:
    name: Deterministic baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - env:
          NODE_OPTIONS: '--require=${{ github.workspace }}/scripts/lib/fixed-date-register.js'
        run: npm run build
      - env:
          NODE_OPTIONS: '--require=${{ github.workspace }}/scripts/lib/fixed-date-register.js'
        run: npm test
      - env:
          NODE_OPTIONS: '--require=${{ github.workspace }}/scripts/lib/fixed-date-register.js'
        run: npm run report:opportunity-health -- --deployment-check
      - name: Retain current evidence review findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-health
          path: output/opportunity-health/
      - name: Compare generated output with PR base
        env:
          NODE_OPTIONS: '--require=${{ github.workspace }}/scripts/lib/fixed-date-register.js'
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          base_dir="${RUNNER_TEMP}/freehub-base"
          candidate_absent_dir="${RUNNER_TEMP}/freehub-candidate-absent"
          fixed_date_register="${GITHUB_WORKSPACE}/scripts/lib/fixed-date-register.js"
          cleanup() { git worktree remove --force "$base_dir" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          # Compare with the actual base in GitHub's checked-out PR merge, including newer main commits.
          # An older PR's event base SHA can still describe its original target snapshot.
          git worktree add --detach "$base_dir" "$(git rev-parse HEAD^1)"
          (cd "$base_dir" && npm ci --ignore-scripts && NODE_OPTIONS="--require=$fixed_date_register" FREEHUB_BUILD_DATE="$FREEHUB_BUILD_DATE" FREEHUB_AS_OF_DATE="$FREEHUB_AS_OF_DATE" node scripts/generate-pages.js)
          node scripts/capture-generated-output.js --output-dir="$candidate_absent_dir"
          echo "Compare feature flag absent with PR base"
          node scripts/compare-generated-output.js --base-dir="$base_dir" --allow-portfolio-recovery --allow-airtime-dash --allow-november-2026-link-review
          echo "Compare feature flag explicitly disabled with PR base"
          FREEHUB_ENABLE_OPPORTUNITIES=false npm run build
          node scripts/compare-generated-output.js --base-dir="$base_dir" --allow-portfolio-recovery --allow-airtime-dash --allow-november-2026-link-review
          node scripts/compare-generated-output.js --base-dir="$candidate_absent_dir"
          echo "Compare Opportunity-enabled output with the PR base under the same flag"
          (cd "$base_dir" && FREEHUB_ENABLE_OPPORTUNITIES=true NODE_OPTIONS="--require=$fixed_date_register" node scripts/generate-pages.js)
          FREEHUB_ENABLE_OPPORTUNITIES=true npm run build
          FREEHUB_ENABLE_OPPORTUNITIES=true npm run test:seo
          node scripts/compare-generated-output.js --base-dir="$base_dir" --allow-portfolio-recovery --allow-airtime-dash --allow-november-2026-link-review
      - name: Validate the populated offers portal
        env:
          NODE_OPTIONS: '--require=${{ github.workspace }}/scripts/lib/fixed-date-register.js'
        run: |
          FREEHUB_ENABLE_OFFERS=true npm run build
          FREEHUB_ENABLE_OFFERS=true npm run test:seo

  links:
    name: Live link and warning baseline
    runs-on: ubuntu-latest
    # External sources and review receipts must be checked at today's date.
    # Historical fixtures remain confined to the baseline and browser jobs.
    env:
      FREEHUB_BUILD_DATE: ''
      FREEHUB_AS_OF_DATE: ''
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint:ci

  browser:
    name: Chromium smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - env:
          NODE_OPTIONS: '--require=${{ github.workspace }}/scripts/lib/fixed-date-register.js'
        run: FREEHUB_ENABLE_OPPORTUNITIES=false npm run build
      - run: npx playwright install --with-deps chromium
      - env:
          NODE_OPTIONS: '' # Browser fixtures control page clocks; keep the automation clock real.
        run: npm run test:browser
      - env:
          NODE_OPTIONS: '--require=${{ github.workspace }}/scripts/lib/fixed-date-register.js'
        run: FREEHUB_ENABLE_OPPORTUNITIES=true npm run build
      - env:
          NODE_OPTIONS: ''
        run: FREEHUB_ENABLE_OPPORTUNITIES=true npm run test:browser
      - env:
          NODE_OPTIONS: '--require=${{ github.workspace }}/scripts/lib/fixed-date-register.js'
        run: FREEHUB_ENABLE_OPPORTUNITIES=false FREEHUB_ENABLE_OFFERS=true npm run build
      - env:
          NODE_OPTIONS: ''
        run: FREEHUB_ENABLE_OPPORTUNITIES=false FREEHUB_ENABLE_OFFERS=true npm run test:browser
      - name: Build the published Grocery Savings fixture
        env:
          FREEHUB_BUILD_DATE: '2026-10-26'
          FREEHUB_AS_OF_DATE: '2026-10-26'
          FREEHUB_ENABLE_OFFERS: 'true'
          NODE_OPTIONS: '--require=${{ github.workspace }}/scripts/lib/fixed-date-register.js'
        run: npm run build
      - name: Test the published Grocery Savings pages
        env:
          FREEHUB_BUILD_DATE: '2026-10-26'
          FREEHUB_AS_OF_DATE: '2026-10-26'
          FREEHUB_ENABLE_OFFERS: 'true'
          NODE_OPTIONS: ''
        run: npx playwright test tests/browser/grocery-savings.spec.js
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-regression-artifacts
          path: output/playwright/
          if-no-files-found: ignore
