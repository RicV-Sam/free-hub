name: Reviewed competition release validation
on:
  push:
    branches: ["review/release-2026-10-24"]
permissions:
  contents: read
jobs:
  release-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Fixed-date build and complete test suite
        env:
          TZ: UTC
          FREEHUB_BUILD_DATE: "2026-09-08"
          FREEHUB_AS_OF_DATE: "2026-09-08"
          NODE_OPTIONS: "--require=./scripts/lib/fixed-date-register.js"
        run: |
          npm run build
          npm test
      - name: Offers-enabled SEO gates
        env:
          TZ: UTC
          FREEHUB_BUILD_DATE: "2026-09-08"
          FREEHUB_AS_OF_DATE: "2026-09-08"
          NODE_OPTIONS: "--require=./scripts/lib/fixed-date-register.js"
          FREEHUB_ENABLE_OFFERS: "true"
        run: |
          npm run build
          npm run test:seo
      - name: Browser checks
        env:
          CI: "true"
        run: |
          npx playwright install --with-deps chromium
          FREEHUB_BUILD_DATE=2026-09-08 FREEHUB_AS_OF_DATE=2026-09-08 NODE_OPTIONS=--require=./scripts/lib/fixed-date-register.js npm run build
          npm run test:browser
      - name: Production-date build and lifecycle
        env:
          FREEHUB_ENABLE_OFFERS: "true"
        run: |
          npm run build
          npm run test:seo
          node scripts/validate-maintenance-state.js
